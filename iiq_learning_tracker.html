<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SailPoint IIQ — Learning Tracker</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3248;
    --accent: #4f8ef7;
    --accent2: #38d9a9;
    --warn: #f7c948;
    --text: #dce3f0;
    --muted: #7a83a6;
    --done: #38d9a9;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px 28px;
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
  }
  header h1 { font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: .4px; }
  header p  { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .save-status { font-size: 11px; color: var(--accent2); white-space: nowrap; }
  /* ── Overall progress ── */
  .overall-bar-wrap {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 12px 28px; display: flex; align-items: center; gap: 14px;
  }
  .overall-label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .bar-outer { flex: 1; background: var(--border); border-radius: 20px; height: 8px; }
  .bar-inner  { height: 8px; border-radius: 20px; background: var(--accent); transition: width .4s; }
  .overall-pct { font-size: 13px; font-weight: 700; color: var(--accent); min-width: 36px; text-align: right; }
  /* ── Layout ── */
  main { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }
  /* ── Section card ── */
  .section-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 16px; overflow: hidden;
  }
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; cursor: pointer; user-select: none;
    border-bottom: 1px solid transparent; transition: background .15s;
  }
  .section-header:hover { background: var(--surface2); }
  .section-header.open { border-bottom-color: var(--border); }
  .sec-left { display: flex; align-items: center; gap: 10px; }
  .sec-num {
    font-size: 10px; font-weight: 700; color: var(--bg);
    background: var(--accent); border-radius: 4px;
    padding: 2px 7px; letter-spacing: .5px;
  }
  .sec-title { font-size: 14px; font-weight: 600; }
  .sec-depth { font-size: 11px; color: var(--warn); margin-left: 8px; }
  .sec-right { display: flex; align-items: center; gap: 12px; }
  .sec-pct { font-size: 12px; font-weight: 700; color: var(--accent2); min-width: 32px; text-align: right; }
  .sec-bar-outer { width: 80px; background: var(--border); border-radius: 20px; height: 5px; }
  .sec-bar-inner  { height: 5px; border-radius: 20px; background: var(--accent2); transition: width .4s; }
  .chevron { color: var(--muted); font-size: 12px; transition: transform .2s; }
  .chevron.open { transform: rotate(180deg); }
  /* ── Section body ── */
  .section-body { padding: 14px 18px; display: none; }
  .section-body.open { display: block; }
  /* ── Item row ── */
  .item { margin-bottom: 14px; }
  .item-top { display: flex; align-items: flex-start; gap: 10px; }
  .item-top input[type="checkbox"] {
    margin-top: 3px; flex-shrink: 0;
    width: 16px; height: 16px;
    accent-color: var(--accent2); cursor: pointer;
  }
  .item-label { font-size: 13px; cursor: pointer; }
  .item-label.checked { color: var(--muted); text-decoration: line-through; }
  .item-note {
    margin-top: 6px; margin-left: 26px;
    width: calc(100% - 26px);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 5px; color: var(--text);
    font-size: 12px; font-family: inherit;
    padding: 7px 10px; resize: vertical; min-height: 36px;
    outline: none; transition: border .15s;
  }
  .item-note:focus { border-color: var(--accent); }
  .item-note::placeholder { color: var(--muted); }
  /* ── Tags ── */
  .tag {
    display: inline-block; font-size: 10px; font-weight: 600;
    padding: 1px 6px; border-radius: 3px; margin-left: 6px;
    vertical-align: middle;
  }
  .tag-core  { background: #3b2b4a; color: #c084fc; }
  .tag-rule  { background: #1e3a2e; color: var(--accent2); }
  .tag-hands { background: #2a2010; color: var(--warn); }
  /* ── Buttons ── */
  .btn {
    padding: 6px 14px; border-radius: 5px; cursor: pointer;
    font-size: 12px; font-family: inherit; transition: background .15s;
  }
  .btn-export {
    background: transparent; border: 1px solid var(--accent2); color: var(--accent2);
  }
  .btn-export:hover { background: #38d9a920; }
  .btn-import {
    background: transparent; border: 1px solid var(--accent); color: var(--accent);
  }
  .btn-import:hover { background: #4f8ef720; }
  .reset-btn {
    background: transparent; border: 1px solid #e55; color: #e55;
    padding: 6px 14px; border-radius: 5px; cursor: pointer; font-size: 12px;
    transition: background .15s;
  }
  .reset-btn:hover { background: #e5555520; }
  /* ── Toast ── */
  #toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-size: 12px; padding: 10px 20px;
    border-radius: 6px; opacity: 0; pointer-events: none;
    transition: opacity .3s; z-index: 999;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div>
    <h1>SailPoint IIQ — Implementation Engineer Tracker</h1>
    <p>3.5 Years Experience Level &nbsp;·&nbsp; Check off topics as you cover them &nbsp;·&nbsp; Notes auto-save locally</p>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end">
    <span class="save-status" id="saveStatus">All saved ✓</span>
    <button class="btn btn-export" onclick="exportProgress()">⬇ Export Progress</button>
    <button class="btn btn-import" onclick="document.getElementById('importFile').click()">⬆ Import Progress</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importProgress(event)">
    <button class="reset-btn" onclick="confirmReset()">Reset All</button>
  </div>
</header>

<div id="toast"></div>

<div class="overall-bar-wrap">
  <span class="overall-label">Overall Progress</span>
  <div class="bar-outer"><div class="bar-inner" id="overallBar" style="width:0%"></div></div>
  <span class="overall-pct" id="overallPct">0%</span>
</div>

<main id="main"></main>

<script>
// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────
const sections = [
  {
    id: "s1", num: "01", title: "IIQ Architecture & Core Concepts",
    depth: "Strong fundamentals — can explain to client",
    items: [
      "IIQ component architecture (UI, Services, DB, Connector layer)",
      "iiq.properties and environment configuration",
      "Object model — Identity, Link, Application, Bundle, Certification, WorkItem, TaskResult",
      "IIQ XML object lifecycle (import/export via iiq console)",
      "Deployment modes — single node vs clustered",
      "Patch vs upgrade understanding (conceptual level)"
    ]
  },
  {
    id: "s2", num: "02", title: "Application Onboarding",
    depth: "Must be hands-on — this is core implementation work",
    items: [
      "Connector configuration — AD, LDAP, JDBC, Flat File (Delimited), ServiceNow, Workday",
      "Schema definition — account attributes and group schema",
      "Aggregation — full vs delta, account vs group aggregation",
      "Correlation Rule — writing custom BeanShell correlation logic",
      "Customization Rule — field-level attribute mapping during aggregation",
      "Creation Rule — provisioning attribute population",
      "Before Provisioning Rule",
      "After Provisioning Rule",
      "Manual Correlation handling",
      "Application testing methodology (test aggregation → correlation → provisioning)"
    ]
  },
  {
    id: "s3", num: "03", title: "Identity Lifecycle (JML)",
    depth: "Must be able to design and implement end-to-end",
    items: [
      "Joiner — trigger, identity creation, access assignment via Roles/Birthright",
      "Mover — attribute change detection, re-evaluation of access",
      "Leaver — disable, deprovision, revoke access flows",
      "LCE (Lifecycle Event) configuration — trigger types (rule, native change, attribute change)",
      "Refresh Task — when and why to use it",
      "Identity Attributes configuration — direct mapping vs rule-based",
      "Manager correlation"
    ]
  },
  {
    id: "s4", num: "04", title: "Roles & Entitlements (RBAC)",
    depth: "Strong — core to every implementation",
    items: [
      "Role types — IT Role, Business Role, Organizational Role",
      "Role hierarchy and inheritance",
      "Role assignment — automatic vs manual, rule-based assignment",
      "Role composition — IT Role to Business Role mapping",
      "Entitlement catalog management",
      "SoD (Separation of Duties) policy — defining, detecting, remediating",
      "Role mining — concept level"
    ]
  },
  {
    id: "s5", num: "05", title: "Provisioning & Workflows",
    depth: "Must be able to build and troubleshoot",
    items: [
      "Provisioning Plan — AccountRequest and AttributeRequest structure",
      "Provisioning Policy on Application",
      "Provisioning via Role assignment",
      "LCE-triggered provisioning",
      "Workflow basics — Steps, Transitions, Variables, Approvals",
      "Workflow XML structure — Variable block, Step types (Start, Approval, Subprocess, Stop)",
      "OOTB workflows — LCE Provisioning, Identity Refresh (read their XML)",
      "How a workflow gets triggered — LCE config → Workflow name mapping",
      "Approval workflows — work items, escalation, timeout handling",
      "Provisioning result handling — retry, manual, failed",
      "Connector-based vs manual provisioning"
    ]
  },
  {
    id: "s6", num: "06", title: "Certifications (Access Reviews)",
    depth: "Configuration + customization",
    items: [
      "Certification types — Manager, Entitlement Owner, Application Owner, Advanced",
      "Certification schedule configuration",
      "Entity/Item level decisions — Approve, Revoke, Remediate, Allow Exception",
      "Exclusion Rules",
      "Certification event — automatic revocation post-cert",
      "Bulk reassignment and delegation",
      "Certification report interpretation"
    ]
  },
  {
    id: "s7", num: "07", title: "BeanShell / Rule Writing",
    depth: "Must write independently — #1 differentiator at interview",
    items: [
      "Correlation Rule — inputs, logic, return object/map [DONE ✓]",
      "Identity Attribute Rule — direct mapping vs rule-based [DONE ✓]",
      "Before Provisioning Rule — inputs, plan manipulation [DONE ✓]",
      "After Provisioning Rule — post-provisioning actions, notification triggers",
      "Field Value Rule — Provisioning Policy, generate CN/email/OU path",
      "Approval Rule — dynamic approver resolution in workflow step",
      "LCE Trigger Rule — Boolean return, fire/skip condition",
      "Certification Exclusion Rule — exclude identities/items from cert",
      "Customization Rule — attribute mapping during aggregation",
      "Workflow Rule / Step Script — custom logic inside a workflow step",
      "Owner Rule — dynamic WorkItem or cert entity owner assignment",
      "sailpoint.object.* model — Identity, Link, Application, Bundle, ProvisioningPlan",
      "context.getObjectByName() and context.getObject()",
      "context.search() — returns Iterator, not single object",
      "Null safety and early return pattern",
      "Logging — log.debug(), log.error()",
      "Util, Util.isNullOrEmpty(), Differencer utility classes"
    ]
  },
  {
    id: "s8", num: "08", title: "Tasks & Reporting",
    depth: "Configuration + customization",
    items: [
      "Key tasks — Account Aggregation, Identity Refresh, Role Index Refresh, Perform Maintenance",
      "Task scheduling and chaining",
      "TaskResult interpretation and debugging",
      "Report types — LiveReport, Jasper",
      "Custom report building — basic level",
      "Certification report vs audit report"
    ]
  },
  {
    id: "s9", num: "09", title: "Connectors Deep Dive",
    depth: "At least 3–4 connectors hands-on",
    items: [
      "Active Directory — group membership, nested groups, UPN vs sAMAccountName",
      "LDAP — generic vs AD",
      "JDBC — query-based aggregation, provisioning SQL",
      "Delimited File (CSV/Flat File) — HRMS feeds",
      "REST-based connector concept",
      "ServiceNow — ITSM ticketing integration (manual provisioning trigger)",
      "SAP — conceptual awareness"
    ]
  },
  {
    id: "s10", num: "10", title: "Troubleshooting & Debugging",
    depth: "Must be strong — support background is an advantage here",
    items: [
      "Log4j configuration — enabling DEBUG for specific classes",
      "Reading catalina.out and iiq.log",
      "Common errors — ClassCastException, NullPointerException in rules, aggregation failures",
      "Debug pages — /debug, object inspector",
      "Provisioning transaction analysis",
      "Stuck WorkItems and workflow debugging",
      "Task failure root cause analysis"
    ]
  },
  {
    id: "s11", num: "11", title: "Integration Patterns",
    depth: "Conceptual + basic hands-on",
    items: [
      "SCIM provisioning concept",
      "REST API — IIQ REST endpoints for identity/access queries",
      "Email notification templates — Velocity templating",
      "ServiceNow integration — manual provisioning via ticket creation",
      "Workday as authoritative source pattern",
      "Active Directory as provisioning target pattern"
    ]
  },
  {
    id: "s12", num: "12", title: "Governance & Compliance Concepts",
    depth: "Can discuss confidently in client conversations",
    items: [
      "SOX, HIPAA, GDPR — how IIQ addresses compliance requirements",
      "Audit logging and audit reports",
      "SoD policy — regulatory context",
      "Entitlement ownership model",
      "Access certification as a compliance control"
    ]
  },
  {
    id: "s13", num: "13", title: "Deployment & Environment Management",
    depth: "Awareness + basic experience",
    items: [
      "Object migration — XML export/import between Dev → QA → Prod",
      "iiq console commands — import, export, patch",
      "Version control for IIQ XML objects (Git basics)",
      "Environment-specific configuration management",
      "SSB (Standard Services Build) — awareness level"
    ]
  }
];

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function render() {
  const main = document.getElementById("main");
  main.innerHTML = "";

  sections.forEach((sec, si) => {
    const card = document.createElement("div");
    card.className = "section-card";
    card.id = "card-" + sec.id;

    // Header
    const hdr = document.createElement("div");
    hdr.className = "section-header";
    hdr.innerHTML = `
      <div class="sec-left">
        <span class="sec-num">${sec.num}</span>
        <span class="sec-title">${sec.title}</span>
        <span class="sec-depth">${sec.depth}</span>
      </div>
      <div class="sec-right">
        <span class="sec-pct" id="pct-${sec.id}">0%</span>
        <div class="sec-bar-outer"><div class="sec-bar-inner" id="bar-${sec.id}" style="width:0%"></div></div>
        <span class="chevron" id="chev-${sec.id}">▼</span>
      </div>`;
    hdr.addEventListener("click", () => toggleSection(sec.id));
    card.appendChild(hdr);

    // Body
    const body = document.createElement("div");
    body.className = "section-body";
    body.id = "body-" + sec.id;

    sec.items.forEach((item, ii) => {
      const key   = `${sec.id}_item_${ii}`;
      const noteK = `${sec.id}_note_${ii}`;
      const saved = localStorage.getItem(key) === "1";
      const savedNote = localStorage.getItem(noteK) || "";

      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <div class="item-top">
          <input type="checkbox" id="${key}" ${saved ? "checked" : ""}>
          <label class="item-label ${saved ? "checked" : ""}" for="${key}">${item}</label>
        </div>
        <textarea class="item-note" placeholder="Notes…" data-key="${noteK}">${savedNote}</textarea>`;
      body.appendChild(div);

      // Checkbox save
      const cb = div.querySelector("input");
      const lbl = div.querySelector(".item-label");
      cb.addEventListener("change", () => {
        localStorage.setItem(key, cb.checked ? "1" : "0");
        lbl.classList.toggle("checked", cb.checked);
        updateProgress();
        flashSaved();
      });

      // Note save
      const ta = div.querySelector("textarea");
      ta.addEventListener("input", () => {
        localStorage.setItem(noteK, ta.value);
        flashSaved();
      });
    });

    card.appendChild(body);
    main.appendChild(card);
  });

  updateProgress();
}

// ─────────────────────────────────────────────
// TOGGLE
// ─────────────────────────────────────────────
function toggleSection(id) {
  const body = document.getElementById("body-" + id);
  const hdr  = body.previousElementSibling;
  const chev = document.getElementById("chev-" + id);
  const open = body.classList.toggle("open");
  hdr.classList.toggle("open", open);
  chev.classList.toggle("open", open);
}

// ─────────────────────────────────────────────
// PROGRESS
// ─────────────────────────────────────────────
function updateProgress() {
  let totalAll = 0, doneAll = 0;

  sections.forEach(sec => {
    const total = sec.items.length;
    let done = 0;
    sec.items.forEach((_, ii) => {
      if (localStorage.getItem(`${sec.id}_item_${ii}`) === "1") done++;
    });
    totalAll += total;
    doneAll  += done;

    const pct = total ? Math.round((done / total) * 100) : 0;
    const pctEl = document.getElementById("pct-" + sec.id);
    const barEl = document.getElementById("bar-" + sec.id);
    if (pctEl) pctEl.textContent = pct + "%";
    if (barEl) barEl.style.width = pct + "%";
  });

  const overall = totalAll ? Math.round((doneAll / totalAll) * 100) : 0;
  document.getElementById("overallPct").textContent = overall + "%";
  document.getElementById("overallBar").style.width = overall + "%";
}

// ─────────────────────────────────────────────
// SAVE FLASH
// ─────────────────────────────────────────────
let saveTimer;
function flashSaved() {
  const el = document.getElementById("saveStatus");
  el.textContent = "Saving…";
  el.style.color = "var(--warn)";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    el.textContent = "All saved ✓";
    el.style.color = "var(--accent2)";
  }, 600);
}

// ─────────────────────────────────────────────
// RESET
// ─────────────────────────────────────────────
function confirmReset() {
  if (confirm("This will clear ALL checkboxes and notes. Are you sure?")) {
    localStorage.clear();
    render();
  }
}

// ─────────────────────────────────────────────
// EXPORT
// ─────────────────────────────────────────────
function exportProgress() {
  const data = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    data[k] = localStorage.getItem(k);
  }
  const payload = {
    exported: new Date().toISOString(),
    version: "1.0",
    data: data
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  const date = new Date().toISOString().slice(0, 10);
  a.href     = url;
  a.download = `iiq_tracker_${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast("✓ Progress exported — copy the .json file to your other device and import it there");
}

// ─────────────────────────────────────────────
// IMPORT
// ─────────────────────────────────────────────
function importProgress(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const payload = JSON.parse(e.target.result);
      if (!payload.data || typeof payload.data !== "object") {
        showToast("✗ Invalid file — please use a file exported from this tracker");
        return;
      }
      if (!confirm(`This will REPLACE your current progress with the imported data (exported on ${payload.exported ? payload.exported.slice(0,10) : "unknown date"}). Continue?`)) {
        event.target.value = "";
        return;
      }
      localStorage.clear();
      Object.entries(payload.data).forEach(([k, v]) => localStorage.setItem(k, v));
      render();
      showToast("✓ Progress imported successfully");
    } catch (err) {
      showToast("✗ Could not read file — make sure it is a valid tracker export");
    }
    event.target.value = "";
  };
  reader.readAsText(file);
}

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3500);
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
render();
</script>
</body>
</html>
